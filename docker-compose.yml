version: "3.9"

services:
  postgres17:
    image: postgres:17
    container_name: pg17-dev
    restart: "no"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - pg17data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: pay-activemq
    restart: "no"
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ACTIVEMQ_CONNECTION_USER: admin
      ACTIVEMQ_CONNECTION_PASSWORD: admin
      ACTIVEMQ_WEBCONSOLE_USE_DEFAULT_ADDRESS: "false"
    volumes:
      - activemqdata:/opt/apache-activemq/data   # ← correct path

volumes:
  pg17data:
  activemqdata:
